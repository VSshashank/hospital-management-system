<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard - HealthConnect</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230d9488'><path d='M12 2L13.88 7.33L19.5 8.24L15.25 12.37L16.3 18.02L12 15.27L7.7 18.02L8.75 12.37L4.5 8.24L10.12 7.33L12 2Z'/></svg>">
    
    <!-- Dark Mode Init -->
    <script>
    (function() {
        try {
            document.documentElement.classList.add('dark-mode');
        } catch (e) { console.error('Theme loader script failed:', e); }
    })();
    </script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Source+Sans+Pro:wght@300;400;600;700&display=swap">
    
    <!-- Icons & Charts -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- Styles (From Admin Dashboard) -->
    <style>
        :root {
            /* Light mode colors - Healthcare focused */
            --bg-primary: linear-gradient(135deg, #0d9488 0%, #14b8a6 100%);
            --bg-secondary: #ffffff;
            --bg-tertiary: #f0fdfa;
            --bg-quaternary: #ccfbf1;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-tertiary: #64748b;
            --text-quaternary: #94a3b8;
            --border-primary: #e0f2f1;
            --border-secondary: #b2dfdb;
            --accent-primary: #0d9488;
            --accent-secondary: #14b8a6;
            --accent-tertiary: #ccfbf1;
            --accent-primary-faded: rgba(13, 148, 136, 0.1);
            --success: #059669;
            --success-bg: #d1fae5;
            --success-text: #065f46;
            --warning: #d97706;
            --warning-bg: #fef3c7;
            --warning-text: #92400e;
            --danger: #dc2626;
            --danger-bg: #fee2e2;
            --danger-text: #991b1b;
            --info: #0284c7;
            --info-bg: #e0f2fe;
            --info-text: #075985;
            --shadow-sm: 0 2px 10px rgba(13, 148, 136, 0.08);
            --shadow-md: 0 4px 15px rgba(13, 148, 136, 0.12);
            --shadow-lg: 0 10px 25px rgba(13, 148, 136, 0.15);
            --shadow-xl: 0 20px 40px rgba(13, 148, 136, 0.18);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --space-xs: 0.5rem;
            --space-sm: 1rem;
            --space-md: 1.5rem;
            --space-lg: 2rem;
            --space-xl: 3rem;
        }

        body.dark-mode {
            /* Dark mode colors - Healthcare focused */
            --bg-primary: linear-gradient(135deg, #115e59 0%, #0f766e 100%);
            --bg-secondary: #0f172a;
            --bg-tertiary: #1e293b;
            --bg-quaternary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #e2e8f0;
            --text-tertiary: #cbd5e1;
            --text-quaternary: #94a3b8;
            --border-primary: #334155;
            --border-secondary: #475569;
            --accent-primary: #5eead4;
            --accent-secondary: #2dd4bf;
            --accent-tertiary: #134e4a;
            --accent-primary-faded: rgba(94, 234, 212, 0.1);
            --success: #34d399;
            --success-bg: #064e3b;
            --success-text: #a7f3d0;
            --warning: #fbbf24;
            --warning-bg: #78350f;
            --warning-text: #fde68a;
            --danger: #f87171;
            --danger-bg: #7f1d1d;
            --danger-text: #fecaca;
            --info: #60a5fa;
            --info-bg: #1e3a8a;
            --info-text: #bfdbfe;
            --shadow-sm: 0 2px 10px rgba(0,0,0,0.4);
            --shadow-md: 0 4px 15px rgba(0,0,0,0.5);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.6);
            --shadow-xl: 0 20px 40px rgba(0,0,0,0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Source Sans Pro', sans-serif;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            transition: var(--transition);
            line-height: 1.6;
            overflow-x: hidden;
        }
        button, input, select, textarea { font-family: 'Source Sans Pro', sans-serif; font-size: 0.875rem; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Lora', serif; font-weight: 700; color: var(--text-primary); }
        a { color: var(--accent-primary); text-decoration: none; cursor: pointer; }

        /* Layout */
        .portal-layout { display: flex; min-height: 100vh; }
        
        /* Sidebar */
        .sidebar {
            position: fixed; top: 0; left: 0; width: 280px; height: 100vh;
            background: var(--bg-secondary); border-right: 1px solid var(--border-primary);
            box-shadow: var(--shadow-sm); display: flex; flex-direction: column;
            transition: transform 0.3s ease; z-index: 1000; padding-bottom: var(--space-md);
        }
        .sidebar-header {
            display: flex; align-items: center; gap: 0.75rem; font-weight: 700; font-size: 1.5rem;
            color: var(--text-primary); padding: var(--space-md) var(--space-lg);
            border-bottom: 1px solid var(--border-primary);
        }
        .sidebar-nav { flex: 1; overflow-y: auto; padding: var(--space-md) var(--space-sm); }
        .nav-group { margin-bottom: var(--space-md); }
        .nav-group-title {
            font-size: 0.75rem; font-weight: 600; color: var(--text-tertiary);
            text-transform: uppercase; letter-spacing: 0.5px; padding: 0 var(--space-sm) var(--space-xs);
        }
        .nav-item {
            display: flex; align-items: center; padding: 0.85rem var(--space-sm);
            border-radius: 8px; color: var(--text-secondary); font-weight: 500;
            margin-bottom: 0.25rem; transition: var(--transition); cursor: pointer;
        }
        .nav-item i { width: 20px; height: 20px; margin-right: 0.75rem; color: var(--text-tertiary); }
        .nav-item:hover { background: var(--bg-tertiary); color: var(--text-primary); transform: translateX(5px); }
        .nav-item.active { background: var(--bg-primary); color: white; box-shadow: var(--shadow-md); transform: translateX(5px); }
        body.dark-mode .nav-item.active { color: var(--text-primary); }
        .nav-item.active i { color: inherit; }
        .nav-item-badge {
            margin-left: auto; background: var(--danger); color: white;
            font-size: 0.75rem; font-weight: 600; padding: 0.1rem 0.4rem; border-radius: 6px;
        }
        .sidebar-footer { padding: 0 var(--space-sm); }
        
        /* Mobile Header */
        .mobile-header {
            display: none; position: sticky; top: 0; background: var(--bg-secondary);
            padding: var(--space-sm) var(--space-md); border-bottom: 1px solid var(--border-primary);
            z-index: 999; align-items: center; justify-content: space-between; box-shadow: var(--shadow-sm);
        }
        .mobile-logo { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; font-size: 1.25rem; color: var(--text-primary); }
        .mobile-menu-btn { background: none; border: none; color: var(--text-primary); padding: 0.5rem; }

        /* Main Content */
        .main-content { flex: 1; margin-left: 280px; padding: var(--space-lg); overflow-x: hidden; }
        .main-content-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-md); }
        .main-content-header h1 { font-size: 2.25rem; }
        .header-actions { display: flex; align-items: center; gap: 1rem; }
        
        .search-bar { position: relative; }
        .search-bar input {
            padding: 0.75rem 1rem 0.75rem 3rem; border-radius: 8px;
            border: 1px solid var(--border-secondary); background: var(--bg-secondary);
            color: var(--text-primary); width: 300px; transition: all 0.2s; outline: none;
        }
        .search-bar input:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 3px var(--accent-primary-faded); }
        .search-bar svg { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); width: 18px; height: 18px; }

        .notification-btn {
            position: relative; padding: 0.75rem; background: var(--bg-secondary);
            border: 1px solid var(--border-secondary); color: var(--text-tertiary);
            border-radius: 8px; cursor: pointer; display: flex;
        }
        .notification-badge {
            position: absolute; top: -5px; right: -5px; background: var(--danger);
            color: white; border-radius: 50%; width: 20px; height: 20px;
            font-size: 0.75rem; display: flex; align-items: center; justify-content: center; font-weight: 600;
        }

        /* User Profile in Sidebar */
        .sidebar-footer .user-profile {
            display: flex; align-items: center; gap: 0.75rem; padding: var(--space-sm);
            margin: 0 0 var(--space-md); border-radius: 12px; background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
        }
        .user-profile-avatar {
            width: 40px; height: 40px; border-radius: 50%; background: var(--bg-primary);
            color: white; display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 1.1rem; flex-shrink: 0; font-family: 'Lora', serif;
        }
        body.dark-mode .user-profile-avatar { color: var(--text-primary); }
        .user-profile-info { text-align: left; flex-grow: 1; }
        .user-profile-name { font-weight: 600; color: var(--text-primary); font-size: 0.875rem; }
        .user-profile-email { font-size: 0.75rem; color: var(--text-tertiary); }

        /* Components */
        .glass-card {
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 20px;
            padding: var(--space-md); box-shadow: var(--shadow-sm); height: 100%; margin-bottom: var(--space-md);
        }
        body.dark-mode .glass-card { background: rgba(29, 41, 59, 0.6); border: 1px solid var(--border-primary); }
        .glass-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-md); }
        .glass-card-header h3 { font-size: 1.25rem; color: var(--text-primary); }
        .icon-header { display: flex; align-items: center; gap: var(--space-sm); }
        .icon-header i { color: var(--accent-primary); background: var(--accent-tertiary); padding: 0.5rem; border-radius: 8px; }

        .btn {
            border: none; padding: 0.75rem 1.5rem; border-radius: 12px; font-size: 0.875rem;
            cursor: pointer; font-weight: 600; transition: var(--transition);
            display: inline-flex; align-items: center; gap: 0.5rem;
        }
        .btn-primary { background: var(--bg-primary); color: white; box-shadow: 0 4px 6px rgba(13, 148, 136, 0.25); }
        body.dark-mode .btn-primary { color: var(--text-primary); }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-primary); }
        .btn-danger { background-color: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger); }
        
        .tag { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 99px; font-size: 0.75rem; font-weight: 600; }
        .tag-green { background: var(--success-bg); color: var(--success-text); }
        .tag-blue { background: var(--info-bg); color: var(--info-text); }
        .tag-yellow { background: var(--warning-bg); color: var(--warning-text); }
        .tag-red { background: var(--danger-bg); color: var(--danger-text); }
        .tag-gray { background: var(--bg-quaternary); color: var(--text-tertiary); }

        table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        table th { text-align: left; padding: 0.75rem 1rem; background: var(--bg-tertiary); color: var(--text-tertiary); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; border-bottom: 1px solid var(--border-primary); }
        table td { padding: 1rem; border-bottom: 1px solid var(--border-primary); color: var(--text-secondary); }
        table tr:last-child td { border-bottom: none; }
        table tr:hover td { background: var(--bg-tertiary); }

        .form-group { margin-bottom: var(--space-md); }
        .form-group label { display: block; font-weight: 600; color: var(--text-primary); margin-bottom: var(--space-xs); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 0.75rem 1rem; border-radius: 8px;
            border: 1px solid var(--border-secondary); background: var(--bg-secondary);
            color: var(--text-primary); font-size: 0.875rem; outline: none;
        }
        .form-group input:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 3px var(--accent-primary-faded); }

        /* Dashboard Specifics */
        .welcome-banner {
            background: var(--bg-primary); border-radius: 20px; padding: var(--space-lg);
            margin-bottom: var(--space-md); color: white; display: flex; justify-content: space-between; align-items: center;
        }
        body.dark-mode .welcome-banner, body.dark-mode .welcome-banner h2 { color: var(--text-primary); }
        .welcome-banner h2 { font-size: 1.75rem; margin-bottom: 0; }
        .welcome-banner-icon { font-size: 3rem; opacity: 0.3; }

        .dashboard-stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-md); margin-bottom: var(--space-md); }
        .stat-card {
            display: flex; align-items: center; gap: var(--space-md); background: var(--bg-secondary);
            border-radius: 12px; padding: var(--space-md); border: 1px solid var(--border-primary); box-shadow: var(--shadow-sm);
        }
        .stat-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; }
        .stat-icon.blue { background: var(--info-bg); color: var(--info-text); }
        .stat-icon.green { background: var(--success-bg); color: var(--success-text); }
        .stat-icon.purple { background: var(--accent-tertiary); color: var(--accent-primary); }
        .stat-icon.orange { background: var(--warning-bg); color: var(--warning-text); }
        .stat-info h3 { font-size: 2rem; margin-bottom: 0.25rem; line-height: 1; }
        .stat-info p { font-size: 0.875rem; color: var(--text-tertiary); }

        .dashboard-main-grid { display: grid; grid-template-columns: 2fr 1fr; gap: var(--space-md); }
        
        .page-content { display: none; }
        .page-content.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Modals */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(5px);
            display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal-overlay.show { display: flex; animation: fadeIn 0.3s ease; }
        .modal-content {
            width: 100%; max-width: 500px; margin: var(--space-sm);
            background: var(--bg-secondary); border-radius: 20px;
            border: 1px solid var(--border-primary); padding: var(--space-md);
            box-shadow: var(--shadow-xl);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-md); }
        .modal-footer { display: flex; justify-content: flex-end; gap: var(--space-sm); margin-top: var(--space-lg); }

        /* Toast */
        #toast-notification {
            position: fixed; top: 20px; right: 20px; z-index: 3000;
            padding: var(--space-sm) var(--space-md); border-radius: 12px;
            background: var(--bg-secondary); box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-primary); color: var(--text-primary);
            font-weight: 600; display: flex; align-items: center; gap: var(--space-sm);
            transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        #toast-notification.show { transform: translateX(0); }
        #toast-notification.toast-success { background: var(--success-bg); color: var(--success-text); border-color: var(--success); }
        #toast-notification.toast-danger { background: var(--danger-bg); color: var(--danger-text); border-color: var(--danger); }

        /* Tabs */
        .tab-nav { display: flex; gap: 1rem; border-bottom: 1px solid var(--border-primary); margin-bottom: 1rem; }
        .tab-btn { padding: 0.5rem 1rem; background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; color: var(--text-tertiary); font-weight: 600; }
        .tab-btn.active { color: var(--accent-primary); border-bottom-color: var(--accent-primary); }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        /* Responsive */
        @media (max-width: 992px) {
            .sidebar { transform: translateX(-100%); box-shadow: var(--shadow-xl); }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .mobile-header { display: flex; }
            .main-content-header { display: none; }
            .dashboard-stats-grid { grid-template-columns: repeat(2, 1fr); }
            .dashboard-main-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 600px) {
            .dashboard-stats-grid { grid-template-columns: 1fr; }
            .search-bar { display: none; }
        }
    </style>
</head>
<body class="dark-mode">

    <!-- TOAST -->
    <div id="toast-notification">
        <i id="toast-icon" data-lucide="check-circle"></i>
        <span id="toast-message">Notification</span>
    </div>

    <!-- MODAL: New Patient -->
    <div class="modal-overlay" id="newPatientModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>New Patient Registration</h3>
                <button class="btn btn-secondary" style="padding: 0.5rem;" onclick="App.closeModal('newPatientModal')"><i data-lucide="x"></i></button>
            </div>
            <form id="patientForm" onsubmit="event.preventDefault(); App.savePatient();">
                <div class="form-group"><label>First Name</label><input type="text" id="pt-fname" required></div>
                <div class="form-group"><label>Last Name</label><input type="text" id="pt-lname" required></div>
                <div class="form-group"><label>Date of Birth</label><input type="date" id="pt-dob" required></div>
                <div class="form-group"><label>Condition</label><input type="text" id="pt-condition" placeholder="e.g. Hypertension"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="App.closeModal('newPatientModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Patient</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: New Prescription -->
    <div class="modal-overlay" id="newPrescriptionModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>New Prescription</h3>
                <button class="btn btn-secondary" style="padding: 0.5rem;" onclick="App.closeModal('newPrescriptionModal')"><i data-lucide="x"></i></button>
            </div>
            <form id="prescriptionForm" onsubmit="event.preventDefault(); App.savePrescription();">
                <div class="form-group"><label>Patient Name</label><input type="text" id="rx-patient-name" readonly></div>
                <div class="form-group">
                    <label>Medication</label>
                    <select id="rx-medication">
                        <option value="Lisinopril">Lisinopril</option>
                        <option value="Metformin">Metformin</option>
                        <option value="Atorvastatin">Atorvastatin</option>
                        <option value="Amlodipine">Amlodipine</option>
                    </select>
                </div>
                <div class="form-group"><label>Dosage</label><input type="text" id="rx-dosage" placeholder="e.g., 10mg once daily"></div>
                <div class="form-group"><label>Instructions</label><textarea id="rx-instructions" rows="3"></textarea></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="App.closeModal('newPrescriptionModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Issue Prescription</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: Patient Details -->
    <div class="modal-overlay" id="patientDetailsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Patient Details</h3>
                <button class="btn btn-secondary" style="padding: 0.5rem;" onclick="App.closeModal('patientDetailsModal')"><i data-lucide="x"></i></button>
            </div>
            <div id="patientDetailsContent"></div>
        </div>
    </div>

    <!-- LAYOUT -->
    <div class="portal-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="portal-sidebar">
            <div class="sidebar-header">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2L13.88 7.33L19.5 8.24L15.25 12.37L16.3 18.02L12 15.27L7.7 18.02L8.75 12.37L4.5 8.24L10.12 7.33L12 2Z" fill="var(--accent-primary)" stroke="var(--accent-primary)" stroke-width="1"/>
                </svg>
                <span style="font-family:'Lora', serif;">HealthConnect</span>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-group">
                    <div class="nav-group-title">Clinical</div>
                    <a class="nav-item active" data-page="dashboard"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
                    <a class="nav-item" data-page="patients">
                        <i data-lucide="users"></i><span>My Patients</span>
                        <div class="nav-item-badge" id="badge-patients" style="display:none">0</div>
                    </a>
                    <a class="nav-item" data-page="appointments">
                        <i data-lucide="calendar"></i><span>Appointments</span>
                        <div class="nav-item-badge" id="badge-appointments" style="display:none">0</div>
                    </a>
                    <a class="nav-item" data-page="prescriptions">
                        <i data-lucide="pill"></i><span>Prescriptions</span>
                        <div class="nav-item-badge" id="badge-prescriptions" style="display:none">0</div>
                    </a>
                    <a class="nav-item" data-page="records"><i data-lucide="file-text"></i><span>Medical Records</span></a>
                    <a class="nav-item" data-page="iot"><i data-lucide="activity"></i><span>IoT Monitoring</span></a>
                </div>
                <div class="nav-group">
                    <div class="nav-group-title">Account</div>
                    <a class="nav-item" data-page="notifications">
                        <i data-lucide="bell"></i><span>Notifications</span>
                        <div class="nav-item-badge" id="badge-notifications" style="display:none">0</div>
                    </a>
                    <a class="nav-item" data-page="settings"><i data-lucide="settings"></i><span>Settings</span></a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-profile-avatar">JS</div>
                    <div class="user-profile-info">
                        <div class="user-profile-name">Dr. John Smith</div>
                        <div class="user-profile-email">Cardiology</div>
                    </div>
                </div>
                <button class="btn btn-danger" style="width:100%; justify-content:center; margin-bottom:0.5rem;" onclick="App.showToast('Logged out', 'success')"><i data-lucide="log-out"></i> Log Out</button>
                <button class="btn btn-secondary" style="width:100%; justify-content:center;" onclick="App.toggleTheme()"><i data-lucide="sun"></i> Theme</button>
            </div>
        </aside>

        <!-- Mobile Header -->
        <header class="mobile-header">
            <div class="mobile-logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 2L13.88 7.33L19.5 8.24L15.25 12.37L16.3 18.02L12 15.27L7.7 18.02L8.75 12.37L4.5 8.24L10.12 7.33L12 2Z" fill="var(--accent-primary)"/></svg>
                HealthConnect
            </div>
            <button class="mobile-menu-btn" onclick="document.getElementById('portal-sidebar').classList.toggle('active')"><i data-lucide="menu"></i></button>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <header class="main-content-header">
                <h1 id="page-title">Dashboard Overview</h1>
                <div class="header-actions">
                    <div class="search-bar">
                        <i data-lucide="search"></i>
                        <input type="text" placeholder="Search patients, records...">
                    </div>
                    <button class="notification-btn" onclick="App.navigate('notifications')">
                        <i data-lucide="bell"></i>
                        <div class="notification-badge" id="header-notif-badge">0</div>
                    </button>
                    <button class="btn btn-primary" onclick="App.openModal('newPatientModal')">
                        <i data-lucide="plus"></i> New Patient
                    </button>
                </div>
            </header>

            <div id="page-container">
                <!-- Dynamic Content Loaded Here -->
            </div>
        </main>
    </div>

    <script>
        // --- DATA STORE (From doctor.js) ---
        const AppData = {
            currentUser: { name: 'Dr. John Smith', id: 'D1001', specialty: 'Cardiology' },
            patients: [
                { id: 'pat-1', name: 'Sarah Johnson', dob: '1985-06-15', gender: 'Female', condition: 'Hypertension', lastAppointment: '2025-08-01', contact: 'sarah.j@email.com', priority: 'high' },
                { id: 'pat-2', name: 'Michael Rodriguez', dob: '1978-03-22', gender: 'Male', condition: 'Type 2 Diabetes', lastAppointment: '2025-07-28', contact: 'm.rod@email.com', priority: 'medium' },
                { id: 'pat-3', name: 'Jennifer Kim', dob: '1992-11-05', gender: 'Female', condition: 'Annual Checkup', lastAppointment: '2024-11-15', contact: 'j.kim@email.com', priority: 'medium' },
                { id: 'pat-4', name: 'Robert Brown', dob: '1965-09-18', gender: 'Male', condition: 'High Cholesterol', lastAppointment: '2025-07-22', contact: 'r.brown@email.com', priority: 'low' }
            ],
            appointments: {
                today: [
                    { id: 'apt-1', time: '09:00 AM', patient: 'Sarah Johnson', patientId: 'pat-1', type: 'Follow-up', status: 'confirmed', reason: 'Hypertension' },
                    { id: 'apt-2', time: '10:30 AM', patient: 'Michael Rodriguez', patientId: 'pat-2', type: 'Consultation', status: 'confirmed', reason: 'Diabetes' },
                    { id: 'apt-4', time: '03:00 PM', patient: 'Robert Brown', patientId: 'pat-4', type: 'Follow-up', status: 'pending', reason: 'Lab Results' }
                ],
                upcoming: [
                    { id: 'apt-5', time: 'Aug 15, 11:00 AM', patient: 'Lisa Anderson', type: 'Consultation', status: 'confirmed', reason: 'New Patient' }
                ]
            },
            prescriptions: [
                { id: 'rx-1', patient: 'Sarah Johnson', medication: 'Lisinopril', dosage: '10mg', status: 'active', refills: 1 },
                { id: 'rx-3', patient: 'Robert Brown', medication: 'Atorvastatin', dosage: '20mg', status: 'pending', refills: 0 }
            ],
            notifications: [
                { id: 1, title: 'Lab Results', message: 'Results for Sarah Johnson available', time: '30m ago', type: 'info', isRead: false },
                { id: 2, title: 'Refill Request', message: 'Robert Brown requested Atorvastatin', time: '2h ago', type: 'warning', isRead: false }
            ]
        };

        const App = {
            charts: {},
            currentPage: 'dashboard',

            init: () => {
                lucide.createIcons();
                App.setupNavigation();
                App.updateBadges();
                App.loadPage('dashboard');
            },

            setupNavigation: () => {
                document.querySelectorAll('.nav-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const page = item.dataset.page;
                        App.navigate(page);
                    });
                });
            },

            navigate: (pageId) => {
                App.currentPage = pageId;
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                const navItem = document.querySelector(`.nav-item[data-page="${pageId}"]`);
                if(navItem) navItem.classList.add('active');
                
                App.loadPage(pageId);
                // Close mobile sidebar
                document.getElementById('portal-sidebar').classList.remove('active');
            },

            updateBadges: () => {
                const highPriorityPatients = AppData.patients.filter(p => p.priority === 'high').length;
                const pendingApts = AppData.appointments.today.filter(a => a.status === 'pending').length;
                const pendingRx = AppData.prescriptions.filter(p => p.status === 'pending').length;
                const unreadNotifs = AppData.notifications.filter(n => !n.isRead).length;

                App.setBadge('badge-patients', highPriorityPatients);
                App.setBadge('badge-appointments', pendingApts);
                App.setBadge('badge-prescriptions', pendingRx);
                App.setBadge('badge-notifications', unreadNotifs);
                App.setBadge('header-notif-badge', unreadNotifs);
            },

            setBadge: (id, count) => {
                const el = document.getElementById(id);
                if(el) {
                    el.innerText = count;
                    el.style.display = count > 0 ? 'flex' : 'none';
                }
            },

            loadPage: (pageId) => {
                const container = document.getElementById('page-container');
                const titleEl = document.getElementById('page-title');
                container.innerHTML = '';
                
                // Cleanup charts
                Object.values(App.charts).forEach(c => c.destroy());
                App.charts = {};

                switch(pageId) {
                    case 'dashboard':
                        titleEl.innerText = `Welcome back, ${AppData.currentUser.name}`;
                        App.renderDashboard(container);
                        break;
                    case 'patients':
                        titleEl.innerText = 'Patient Management';
                        App.renderPatients(container);
                        break;
                    case 'appointments':
                        titleEl.innerText = 'Appointments';
                        App.renderAppointments(container);
                        break;
                    case 'prescriptions':
                        titleEl.innerText = 'Prescriptions';
                        App.renderPrescriptions(container);
                        break;
                    case 'notifications':
                        titleEl.innerText = 'Notifications';
                        App.renderNotifications(container);
                        break;
                    case 'iot':
                        titleEl.innerText = 'IoT Monitoring';
                        App.renderIoT(container);
                        break;
                    default:
                        titleEl.innerText = 'Coming Soon';
                        container.innerHTML = `<div class="glass-card page-content active"><p style="text-align:center; color:var(--text-tertiary);">This module is under development.</p></div>`;
                }
                
                lucide.createIcons();
                container.classList.remove('active');
                void container.offsetWidth; // Trigger reflow
                container.classList.add('active');
            },

            // --- RENDERERS ---

            renderDashboard: (container) => {
                const patientsCount = AppData.patients.length;
                const todayApts = AppData.appointments.today.length;
                const pendingRx = AppData.prescriptions.filter(p => p.status === 'pending').length;
                
                container.innerHTML = `
                    <div class="page-content active">
                        <div class="welcome-banner">
                            <div>
                                <h2>Dashboard Overview</h2>
                                <p>Here's what's happening today.</p>
                            </div>
                            <i data-lucide="activity" class="welcome-banner-icon"></i>
                        </div>

                        <div class="dashboard-stats-grid">
                            <div class="stat-card"><div class="stat-icon blue"><i data-lucide="users"></i></div><div class="stat-info"><h3>${patientsCount}</h3><p>Total Patients</p></div></div>
                            <div class="stat-card"><div class="stat-icon green"><i data-lucide="calendar"></i></div><div class="stat-info"><h3>${todayApts}</h3><p>Appointments Today</p></div></div>
                            <div class="stat-card"><div class="stat-icon orange"><i data-lucide="pill"></i></div><div class="stat-info"><h3>${pendingRx}</h3><p>Pending Rx</p></div></div>
                            <div class="stat-card"><div class="stat-icon purple"><i data-lucide="alert-circle"></i></div><div class="stat-info"><h3>2</h3><p>Alerts</p></div></div>
                        </div>

                        <div class="dashboard-main-grid">
                            <div class="glass-card">
                                <div class="glass-card-header">
                                    <div class="icon-header"><i data-lucide="bar-chart-2"></i><h3>Patient Volume</h3></div>
                                </div>
                                <div style="height:300px;"><canvas id="trendChart"></canvas></div>
                            </div>
                            <div class="glass-card">
                                <div class="glass-card-header">
                                    <div class="icon-header"><i data-lucide="list"></i><h3>Action Items</h3></div>
                                </div>
                                <div style="display:flex; flex-direction:column; gap:1rem;">
                                    ${pendingRx > 0 ? `<div style="padding:1rem; background:var(--bg-tertiary); border-radius:12px; border:1px solid var(--border-primary);">
                                        <strong>Review Prescriptions</strong><p style="font-size:0.8rem; color:var(--text-tertiary);">${pendingRx} pending requests</p>
                                        <button class="btn btn-primary" style="margin-top:0.5rem; padding:0.4rem 0.8rem; font-size:0.75rem;" onclick="App.navigate('prescriptions')">Review</button>
                                    </div>` : ''}
                                    <div style="padding:1rem; background:var(--bg-tertiary); border-radius:12px; border:1px solid var(--border-primary);">
                                        <strong>Lab Results</strong><p style="font-size:0.8rem; color:var(--text-tertiary);">Sarah Johnson results available</p>
                                        <button class="btn btn-secondary" style="margin-top:0.5rem; padding:0.4rem 0.8rem; font-size:0.75rem;">View</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                App.initChart();
            },

            renderPatients: (container) => {
                const rows = AppData.patients.map(p => `
                    <tr>
                        <td><strong>${p.name}</strong><br><span style="font-size:0.75rem; color:var(--text-tertiary);">${p.id}</span></td>
                        <td>${p.condition}</td>
                        <td>${p.lastAppointment}</td>
                        <td><span class="tag tag-${p.priority === 'high' ? 'red' : 'green'}">${p.priority.toUpperCase()}</span></td>
                        <td>
                            <button class="btn btn-secondary" style="padding:0.4rem 0.8rem;" onclick="App.viewPatient('${p.id}')">View</button>
                            <button class="btn btn-primary" style="padding:0.4rem 0.8rem;" onclick="App.openPrescriptionModal('${p.name}')">Rx</button>
                        </td>
                    </tr>
                `).join('');

                container.innerHTML = `
                    <div class="glass-card page-content active">
                        <div class="glass-card-header">
                            <div class="icon-header"><i data-lucide="users"></i><h3>Patient Directory</h3></div>
                            <button class="btn btn-primary" onclick="App.openModal('newPatientModal')"><i data-lucide="plus"></i> Add Patient</button>
                        </div>
                        <table>
                            <thead><tr><th>Name</th><th>Condition</th><th>Last Visit</th><th>Priority</th><th>Actions</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                `;
            },

            renderAppointments: (container) => {
                const renderRows = (list) => list.map(a => `
                    <tr>
                        <td style="font-weight:700; color:var(--accent-primary);">${a.time}</td>
                        <td>${a.patient}</td>
                        <td>${a.type}</td>
                        <td>${a.reason}</td>
                        <td><span class="tag tag-${a.status === 'confirmed' ? 'green' : 'yellow'}">${a.status}</span></td>
                        <td>
                            ${a.status === 'pending' ? 
                            `<button class="btn btn-primary" style="padding:0.3rem 0.6rem;" onclick="App.confirmAppointment('${a.id}')">Confirm</button>` : 
                            `<button class="btn btn-secondary" style="padding:0.3rem 0.6rem;">Details</button>`}
                        </td>
                    </tr>
                `).join('');

                container.innerHTML = `
                    <div class="glass-card page-content active">
                        <div class="tab-nav">
                            <button class="tab-btn active" onclick="App.switchTab(this, 'tab-today')">Today</button>
                            <button class="tab-btn" onclick="App.switchTab(this, 'tab-upcoming')">Upcoming</button>
                        </div>
                        <div id="tab-today" class="tab-pane active">
                            <table>
                                <thead><tr><th>Time</th><th>Patient</th><th>Type</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead>
                                <tbody>${renderRows(AppData.appointments.today)}</tbody>
                            </table>
                        </div>
                        <div id="tab-upcoming" class="tab-pane">
                            <table>
                                <thead><tr><th>Date/Time</th><th>Patient</th><th>Type</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead>
                                <tbody>${renderRows(AppData.appointments.upcoming)}</tbody>
                            </table>
                        </div>
                    </div>
                `;
            },

            renderPrescriptions: (container) => {
                const rows = AppData.prescriptions.map(p => `
                    <tr>
                        <td>${p.patient}</td>
                        <td>${p.medication} (${p.dosage})</td>
                        <td>${p.refills}</td>
                        <td><span class="tag tag-${p.status === 'active' ? 'green' : 'yellow'}">${p.status}</span></td>
                        <td>
                            ${p.status === 'pending' ? 
                            `<button class="btn btn-primary" style="padding:0.3rem 0.6rem;" onclick="App.approveRx('${p.id}')">Approve</button> 
                             <button class="btn btn-danger" style="padding:0.3rem 0.6rem;">Deny</button>` : 
                            `<button class="btn btn-secondary" style="padding:0.3rem 0.6rem;">Edit</button>`}
                        </td>
                    </tr>
                `).join('');

                container.innerHTML = `
                    <div class="glass-card page-content active">
                        <div class="glass-card-header">
                            <div class="icon-header"><i data-lucide="pill"></i><h3>Prescription Management</h3></div>
                            <button class="btn btn-primary" onclick="App.openPrescriptionModal('')">New Rx</button>
                        </div>
                        <table>
                            <thead><tr><th>Patient</th><th>Medication</th><th>Refills</th><th>Status</th><th>Actions</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                `;
            },

            renderNotifications: (container) => {
                const items = AppData.notifications.map(n => `
                    <div style="padding:1rem; border-bottom:1px solid var(--border-primary); display:flex; gap:1rem; align-items:flex-start; ${n.isRead ? 'opacity:0.6;' : ''}">
                        <div style="width:10px; height:10px; background:var(--${n.type === 'info' ? 'info' : 'warning'}); border-radius:50%; margin-top:6px;"></div>
                        <div style="flex:1;">
                            <div style="font-weight:600; color:var(--text-primary);">${n.title}</div>
                            <div style="font-size:0.875rem; color:var(--text-secondary);">${n.message}</div>
                            <div style="font-size:0.75rem; color:var(--text-tertiary); margin-top:0.25rem;">${n.time}</div>
                        </div>
                        ${!n.isRead ? `<button class="btn btn-secondary" style="padding:0.2rem 0.5rem; font-size:0.7rem;" onclick="App.markRead(${n.id})">Mark Read</button>` : ''}
                    </div>
                `).join('');
                
                container.innerHTML = `<div class="glass-card page-content active">
                    <div class="glass-card-header"><h3>Notifications</h3></div>
                    ${items}
                </div>`;
            },

            renderIoT: (container) => {
                container.innerHTML = `
                    <div class="glass-card page-content active">
                        <div class="glass-card-header"><div class="icon-header"><i data-lucide="activity"></i><h3>IoT Vitals</h3></div></div>
                        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:1rem;">
                            <div style="padding:1.5rem; border:1px solid var(--border-primary); border-radius:12px; background:var(--bg-secondary);">
                                <div style="display:flex; justify-content:space-between; margin-bottom:1rem;">
                                    <strong>Michael Rodriguez</strong>
                                    <span class="tag tag-red" style="animation:pulse 2s infinite;">High BPM</span>
                                </div>
                                <div style="text-align:center;">
                                    <div style="font-size:2rem; font-weight:700; color:var(--danger);">115 <span style="font-size:1rem;">BPM</span></div>
                                    <div style="font-size:0.875rem; color:var(--text-tertiary);">Heart Rate</div>
                                </div>
                            </div>
                            <div style="padding:1.5rem; border:1px solid var(--border-primary); border-radius:12px; background:var(--bg-secondary);">
                                <div style="display:flex; justify-content:space-between; margin-bottom:1rem;">
                                    <strong>Sarah Johnson</strong>
                                    <span class="tag tag-green">Stable</span>
                                </div>
                                <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; text-align:center;">
                                    <div>
                                        <div style="font-size:1.5rem; font-weight:700; color:var(--success);">72</div>
                                        <div style="font-size:0.75rem;">BPM</div>
                                    </div>
                                    <div>
                                        <div style="font-size:1.5rem; font-weight:700; color:var(--accent-primary);">120/80</div>
                                        <div style="font-size:0.75rem;">BP</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            },

            // --- LOGIC ---

            initChart: () => {
                const ctx = document.getElementById('trendChart');
                if(!ctx) return;
                
                const isDark = document.body.classList.contains('dark-mode');
                const color = isDark ? '#5eead4' : '#0d9488';
                
                App.charts.trend = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                        datasets: [{
                            label: 'Patients Seen',
                            data: [12, 19, 15, 25, 22, 18, 10],
                            borderColor: color,
                            backgroundColor: isDark ? 'rgba(94, 234, 212, 0.1)' : 'rgba(13, 148, 136, 0.1)',
                            fill: true, tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { grid: { color: isDark ? '#334155' : '#e0f2f1' } },
                            x: { grid: { display: false } }
                        }
                    }
                });
            },

            openModal: (id) => document.getElementById(id).classList.add('show'),
            closeModal: (id) => document.getElementById(id).classList.remove('show'),

            savePatient: () => {
                const fname = document.getElementById('pt-fname').value;
                const lname = document.getElementById('pt-lname').value;
                AppData.patients.unshift({
                    id: `pat-${Date.now()}`,
                    name: `${fname} ${lname}`,
                    condition: document.getElementById('pt-condition').value,
                    lastAppointment: 'N/A',
                    priority: 'medium'
                });
                App.showToast('Patient added successfully', 'success');
                App.closeModal('newPatientModal');
                if(App.currentPage === 'patients') App.loadPage('patients');
                App.updateBadges();
            },

            openPrescriptionModal: (name) => {
                document.getElementById('rx-patient-name').value = name || '';
                App.openModal('newPrescriptionModal');
            },

            savePrescription: () => {
                const name = document.getElementById('rx-patient-name').value;
                if(!name) { App.showToast('Patient name required', 'danger'); return; }
                
                AppData.prescriptions.unshift({
                    id: `rx-${Date.now()}`,
                    patient: name,
                    medication: document.getElementById('rx-medication').value,
                    dosage: document.getElementById('rx-dosage').value,
                    refills: 0,
                    status: 'active'
                });
                App.showToast('Prescription issued', 'success');
                App.closeModal('newPrescriptionModal');
                if(App.currentPage === 'prescriptions') App.loadPage('prescriptions');
            },

            approveRx: (id) => {
                const rx = AppData.prescriptions.find(p => p.id === id);
                if(rx) {
                    rx.status = 'active';
                    App.showToast('Prescription approved', 'success');
                    App.loadPage('prescriptions');
                    App.updateBadges();
                }
            },

            confirmAppointment: (id) => {
                const apt = AppData.appointments.today.find(a => a.id === id);
                if(apt) {
                    apt.status = 'confirmed';
                    App.showToast('Appointment Confirmed', 'success');
                    App.loadPage('appointments');
                    App.updateBadges();
                }
            },

            viewPatient: (id) => {
                const p = AppData.patients.find(x => x.id === id);
                if(!p) return;
                
                const html = `
                    <div style="text-align:center; margin-bottom:1.5rem;">
                        <div class="user-profile-avatar" style="width:80px; height:80px; font-size:2rem; margin:0 auto 1rem;">${p.name.charAt(0)}</div>
                        <h2>${p.name}</h2>
                        <span class="tag tag-${p.priority === 'high' ? 'red' : 'green'}">${p.condition}</span>
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                        <div class="form-group"><label>DOB</label><input type="text" value="${p.dob}" readonly></div>
                        <div class="form-group"><label>Last Visit</label><input type="text" value="${p.lastAppointment}" readonly></div>
                        <div class="form-group"><label>Contact</label><input type="text" value="${p.contact}" readonly></div>
                    </div>
                `;
                document.getElementById('patientDetailsContent').innerHTML = html;
                App.openModal('patientDetailsModal');
            },

            markRead: (id) => {
                const n = AppData.notifications.find(x => x.id === id);
                if(n) {
                    n.isRead = true;
                    App.renderNotifications(document.getElementById('page-container'));
                    App.updateBadges();
                }
            },

            switchTab: (btn, paneId) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(paneId).classList.add('active');
            },

            showToast: (msg, type) => {
                const t = document.getElementById('toast-notification');
                document.getElementById('toast-message').innerText = msg;
                t.className = `toast-${type}`;
                document.getElementById('toast-icon').setAttribute('data-lucide', type === 'success' ? 'check-circle' : 'alert-circle');
                lucide.createIcons();
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 3000);
            },

            toggleTheme: () => {
                document.body.classList.toggle('dark-mode');
                if(App.currentPage === 'dashboard') App.initChart();
            }
        };

        document.addEventListener('DOMContentLoaded', App.init);
    </script>
</body>
</html>
